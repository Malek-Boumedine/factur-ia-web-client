# Datasource Prometheus provisionnée au démarrage de Grafana.
# Le `uid` fixe est référencé par le dashboard et les alertes versionnés :
# c'est ce qui rend l'ensemble portable sans configuration manuelle.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
