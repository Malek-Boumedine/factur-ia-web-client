# Configuration Prometheus de la stack locale d'observabilité.
# Scrape l'endpoint /metrics du client Django (port 8000 de l'hôte, qu'il
# tourne directement sur l'hôte ou dans Docker avec le port publié), lancé
# avec OTEL_METRICS_ENABLED=True.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: factur-ia-web
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
