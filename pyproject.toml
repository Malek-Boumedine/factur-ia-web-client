[project]
name = "factur-ia-web-client"
version = "1.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.6.3",
    "django>=6.0.6",
    "django-redis>=7.0.0",
    "django-tailwind-cli>=4.6.2",
    "dotenv>=0.9.9",
    "google-auth>=2.57.0",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-exporter-prometheus>=0.65b0",
    "opentelemetry-instrumentation-django>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "prometheus-client>=0.26.0",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "redis>=8.0.0",
    "requests>=2.34.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "detect-secrets>=1.5.0",
    "django-stubs>=6.0.5",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "python-semantic-release>=10.5.3",
    "ruff>=0.15.16",
    "types-pymysql>=1.1.0",
    "types-requests>=2.33.0.20260712",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
allow_zero_version = false
major_on_zero = true

[tool.coverage.run]
# Le dénominateur de couverture ne compte que le code applicatif : on exclut
# les points d'entrée, le client généré, les migrations et les tests eux-mêmes.
omit = [
    "main.py",
    "manage.py",
    "conftest.py",
    "config/asgi.py",
    "config/wsgi.py",
    "*/migrations/*",
    "*/tests/*",
    "clients/generated/*",
    "apps/*",
    ".venv/*",
]
