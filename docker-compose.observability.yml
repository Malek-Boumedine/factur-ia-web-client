# ==============================================================================
# Stack locale d'observabilité du client web : Prometheus + Grafana.
# Séparée du docker-compose.yml principal : l'application reste lançable seule.
#
# Prérequis : le client Django tourne sur le port 8000 avec
# OTEL_METRICS_ENABLED=True (sinon /metrics répond 404 et Prometheus ne
# collecte rien).
#
# Lancement : docker compose -f docker-compose.observability.yml up -d
# Grafana    : http://localhost:3000  (dashboard et alertes pré-provisionnés)
# Prometheus : http://localhost:9090
#
# Stack jetable : pas de volumes nommés, tout l'état se reconstruit au
# démarrage depuis les fichiers versionnés du dossier observability/.
# NB : mêmes ports (9090/3000) que la stack d'observabilité de l'API data —
# ne pas lancer les deux en même temps.
# ==============================================================================

services:
  # Prometheus : collecte /metrics du client toutes les 15 s (voir
  # observability/prometheus/prometheus.yml).
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: facturia-web-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # Le client tourne sur l'hôte (ou y publie son port 8000) : sous Linux,
    # host.docker.internal doit être créé explicitement.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Grafana : visualisation. Datasource, dashboard et alertes sont
  # provisionnés depuis observability/grafana/ — zéro configuration manuelle.
  grafana:
    image: grafana/grafana:12.4.6
    container_name: facturia-web-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      # Accès anonyme en admin : stack locale de dev, jamais exposée.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
